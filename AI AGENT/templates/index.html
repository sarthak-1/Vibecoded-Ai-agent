<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Brainrotted Agent 🔥</title>
    <!-- Marked.js to parse Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container {
            width: 100%; max-width: 650px; height: 85vh; background: #1e293b;
            border-radius: 16px; display: flex; flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155;
            overflow: hidden;
        }

        .header { background: #3b82f6; padding: 20px; text-align: center; font-weight: bold; font-size: 1.3rem; }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; }
        .msg-user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-agent { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        .msg-agent ul { margin-left: 20px; margin-top: 5px; }
        .msg-agent p { margin-bottom: 5px; }

        .input-area { display: flex; padding: 15px; background: #0f172a; border-top: 1px solid #334155; gap: 10px; }
        input {
            flex: 1; background: #1e293b; border: 1px solid #334155; color: white;
            padding: 12px 16px; border-radius: 8px; outline: none; font-size: 1rem;
        }
        input:focus { border-color: #3b82f6; }
        
        button {
            background: #3b82f6; border: none; color: white; padding: 12px 20px;
            font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        
        .loading { font-style: italic; color: #94a3b8; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">🔥 Brainrotted Agent Ready! 🔥</div>
    <div class="messages" id="chatBox">
        <div class="msg msg-agent">What's good? Drop a topic, headline, or question and I'll break it down no cap fr fr.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type a topic or question..." onkeypress="handleKey(event)">
        <button onclick="sendPrompt()">Send</button>
    </div>
</div>

<script>
    function handleKey(e) { if (e.key === 'Enter') sendPrompt(); }

    async function sendPrompt() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        const chatBox = document.getElementById('chatBox');

        // User Message UI
        const userDiv = document.createElement('div');
        userDiv.className = 'msg msg-user';
        userDiv.textContent = text;
        chatBox.appendChild(userDiv);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Loading Placeholder
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'msg msg-agent loading';
        loadingDiv.textContent = 'Cooking up a response... 🍳';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });

            const data = await res.json();
            chatBox.removeChild(loadingDiv);

            // Agent Message UI
            const agentDiv = document.createElement('div');
            agentDiv.className = 'msg msg-agent';
            agentDiv.innerHTML = marked.parse(data.reply);
            chatBox.appendChild(agentDiv);

        } catch (err) {
            chatBox.removeChild(loadingDiv);
            const errDiv = document.createElement('div');
            errDiv.className = 'msg msg-agent';
            errDiv.style.color = '#f87171';
            errDiv.textContent = 'Failed to connect to backend server.';
            chatBox.appendChild(errDiv);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
